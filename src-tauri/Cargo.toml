[package]
name = "elundus-core"
version = "1.1.0"
description = "Elundus Core Desktop App"
authors = ["Sietse Trommelen"]
edition = "2024"

[lib]
name = "elundus_core_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.6", features = [] }

[dependencies]
tauri = { version = "2.12.7", features = [] }
tauri-plugin-opener = "2.7.3"
tauri-plugin-updater = "2.14.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
reqwest = { version = "0.13.5", features = ["json", "form"] }
tauri-plugin-dialog = "2.8.4"

[profile.dev]
incremental = true

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
